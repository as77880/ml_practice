<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>ML Interview Practice</title>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--card:#fff;--tx:#1e293b;--mu:#64748b;--pr:#2563eb;--prd:#1d4ed8;--bd:#e2e8f0;--ok:#15803d;--okb:#f0fdf4;--bad:#b91c1c;--badb:#fef2f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.15rem;font-weight:700;max-width:720px;margin:auto}
header h1 small{display:block;font-weight:400;font-size:.8rem;color:var(--mu)}
main{max-width:720px;margin:auto;padding:16px 14px 40px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,button,.btn{font:inherit;font-size:.9rem;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
select{flex:1;min-width:120px}
button:hover,.btn:hover{border-color:#cbd5e1;background:#f8fafc}
button.p{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600;padding:10px 20px;font-size:1rem}
button.p:hover{background:var(--prd)}button:disabled{opacity:.45;cursor:not-allowed}
.prog{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 16px}
.prog i{display:block;height:100%;background:var(--pr);transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
h2{margin:8px 0 14px;font-size:1.2rem;line-height:1.4}
.mu{color:var(--mu);font-size:.85rem}
.tag{display:inline-block;background:#eff6ff;color:var(--pr);border-radius:6px;padding:2px 8px;font-size:.75rem;font-weight:600;margin-right:6px}
textarea{width:100%;min-height:150px;padding:12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:var(--tx);font:inherit;resize:vertical}
textarea:focus{outline:2px solid #bfdbfe;border-color:var(--pr)}
pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;margin:8px 0 0}
.model{border-left:4px solid var(--pr);background:#f8fafc;padding:10px 14px;border-radius:0 8px 8px 0}
.hist{background:#f8fafc;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.88rem}
.hist span{display:inline-block;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:1px 10px;margin:3px 4px 0 0}
.kw{border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.9rem}
.hit{background:var(--okb);color:var(--ok)}.miss{background:var(--badb);color:var(--bad)}
.stars{margin:6px 0 14px}.stars button{font-size:1.9rem;line-height:1;padding:2px 6px;border:0;background:none;color:#f59e0b}
.stars button.off{color:#cbd5e1}
</style></head><body><header><h1>ML Interview Practice<small>Write, compare, rate, improve</small></h1></header><main>
<div class="bar">
<select id="lv"><option value="all">All levels</option><option value="0">Easy</option><option value="1">Medium</option><option value="2">Hard</option></select>
<select id="ord"><option value="seq">Sequential</option><option value="rnd">Random</option><option value="weak">Weak first</option></select>
<button id="exp">Export</button><label class="btn">Import<input id="imp" type="file" accept=".json" hidden></label><button id="rst">Reset</button>
</div>
<div class="mu" id="stat"></div><div class="prog"><i id="pb"></i></div><div id="app"></div></main>
<script src="questions.js"></script>
<script>
const KEY='mlq_v1',LV=['Easy','Medium','Hard'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let P=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})();
const save=()=>localStorage.setItem(KEY,JSON.stringify(P));
const avg=h=>h.length?h.reduce((a,x)=>a+x.r,0)/h.length:0;
let list=[],pos=0,cur=null,saved=false;
const stop=new Set('the a an and or of to in is are was for with that this it as be by on can from at which not its their than then also into more most such may use used using when where what how your you we our'.split(' '));
const kw=t=>[...new Set((t.toLowerCase().match(/[a-z][a-z0-9\-]{2,}/g)||[]).filter(w=>!stop.has(w)))];
function build(){
  const lv=$('lv').value,o=$('ord').value;
  list=QUESTIONS.filter(q=>lv==='all'||q.level==+lv);
  if(o==='rnd')list.sort(()=>Math.random()-.5);
  if(o==='weak')list.sort((a,b)=>{const x=P[a.id]||[],y=P[b.id]||[];return (x.length?avg(x):0)-(y.length?avg(y):0)});
  pos=0;render();
}
function render(){
  const q=list[pos];cur=null;saved=false;
  const done=QUESTIONS.filter(x=>(P[x.id]||[]).length).length;
  $('stat').textContent=`Attempted ${done} of ${QUESTIONS.length} questions`;$('pb').style.width=(100*done/Math.max(QUESTIONS.length,1))+'%';
  if(!q){$('app').innerHTML='<div class="card">No questions.</div>';return}
  const h=P[q.id]||[];
  let hist=h.length?`<div class="hist"><b>Previous ratings</b> <span class="mu">(${h.length} attempt${h.length>1?"s":""}, avg ${avg(h).toFixed(1)})</span><br>`+h.map(x=>`<span>★${x.r} · ${x.d}</span>`).join('')+'</div>':'<div class="hist mu">First attempt — no previous ratings</div>';
  $('app').innerHTML=`<div class="card">${hist}<div><span class="tag">${LV[q.level]}</span><span class="mu">Question ${pos+1} of ${list.length}</span></div><h2>${esc(q.q)}</h2>
  <textarea id="ans" placeholder="Apna answer yahan likho..."></textarea><br><br><button class="p" id="sub">Submit</button></div><div id="res"></div>`;
  $('sub').onclick=()=>submit(q);
}
function submit(q){
  const a=$('ans').value.trim();if(!a){alert('Pehle answer likho');return}
  const k=kw(q.a),u=new Set(kw(a)),hit=k.filter(w=>u.has(w)),m=k.length?Math.round(100*hit.length/k.length):0;
  cur={a,m};$('ans').readOnly=true;$('sub').disabled=true;
  const sug=m>=70?5:m>=55?4:m>=40?3:m>=25?2:1;
  $('res').innerHTML=`<div class="card"><b>Model answer</b><div class="model"><pre>${esc(q.a)}</pre></div></div>
  <div class="card"><b>Keyword match: ${m}%</b> <span class="mu">(suggested ★${sug})</span>
  <div class="kw hit">✔ Covered: ${esc(hit.slice(0,25).join(', ')||'-')}</div><div class="kw miss">✘ Missing: ${esc(k.filter(w=>!u.has(w)).slice(0,25).join(', ')||'-')}</div>
  <div><br>Rate your answer (required to continue):</div><div class="stars" id="st"></div>
  <button class="p" id="nx" disabled>Next question →</button></div>`;
  const st=$('st');
  for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent='★';b.className='off';b.onclick=()=>rate(q,i);st.appendChild(b)}
}
function rate(q,r){
  const d=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  const rec={r,d,m:cur.m,a:cur.a,t:Date.now()};
  P[q.id]=P[q.id]||[];
  if(saved)P[q.id][P[q.id].length-1]=rec;else{P[q.id].push(rec);saved=true}
  save();[...$('st').children].forEach((b,i)=>b.className=i<r?'':'off');
  $('nx').disabled=false;$('nx').onclick=()=>{pos=(pos+1)%list.length;render();scrollTo(0,0)};
}
$('lv').onchange=$('ord').onchange=build;
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(P,null,1)],{type:'application/json'}));a.download='ml-quiz-progress.json';a.click()};
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{P=JSON.parse(t);save();build()}catch(x){alert('Invalid file')}})};
$('rst').onclick=()=>{if(confirm('Saari ratings delete karni hain?')){P={};save();build()}};
build();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
